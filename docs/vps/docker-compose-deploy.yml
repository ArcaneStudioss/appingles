# Deploy automático do Inglou (projeto "inglou-deploy" na VPS 2051121).
# A cada 20 s confere o último commit do main no GitHub. Quando muda, reinicia "inglou" (A), espera ficar saudável
# e só então reinicia "inglou-b" (B), como manda o docs/DEPLOY.md. Se A não ficar saudável, B fica na versão anterior.
# Na primeira subida só grava o "marco inicial" (não reinicia nada). O token do GitHub vem do volume do projeto
# "auto-deploy" (somente leitura); nenhum segredo neste arquivo. Logs: docker logs inglou-deploy-watcher-1
services:
  watcher:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - estado:/state
      - segredo:/segredo:ro
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl jq >/dev/null
        REPO=arcanestudioss/appingles
        saudavel() { for i in $$(seq 1 48); do s=$$(docker inspect -f '{{.State.Health.Status}}' $$1 2>/dev/null || true); [ "$$s" = healthy ] && return 0; sleep 5; done; return 1; }
        atualizar() {
          echo "$$(date -u +%FT%TZ) inglou: reiniciando A"
          docker restart inglou-app-1 >/dev/null || { echo "falha ao reiniciar A"; return; }
          sleep 5
          saudavel inglou-app-1 || { echo "$$(date -u +%FT%TZ) A nao ficou saudavel; B mantida na versao anterior"; return; }
          echo "$$(date -u +%FT%TZ) inglou: A saudavel, reiniciando B"
          docker restart inglou-b-app-1 >/dev/null || { echo "falha ao reiniciar B"; return; }
          sleep 5
          saudavel inglou-b-app-1 && echo "$$(date -u +%FT%TZ) inglou: A e B atualizadas" || echo "$$(date -u +%FT%TZ) B nao ficou saudavel"
        }
        while true; do
          GH_TOKEN=$$(grep -E '^GH_TOKEN=' /segredo/gh.env 2>/dev/null | head -1 | cut -d= -f2-)
          sha=$$(curl -fsS -H "Authorization: Bearer $$GH_TOKEN" "https://api.github.com/repos/$$REPO/commits?sha=main&per_page=1" 2>/dev/null | jq -r '.[0].sha // empty' 2>/dev/null || true)
          if [ -z "$$sha" ]; then echo "$$(date -u +%FT%TZ) sem resposta do GitHub (token ou rede)"; sleep 60; continue; fi
          velho=$$(cat /state/inglou 2>/dev/null || true)
          if [ -z "$$velho" ]; then echo "$$sha" > /state/inglou; echo "$$(date -u +%FT%TZ) marco inicial $$sha"
          elif [ "$$sha" != "$$velho" ]; then echo "$$sha" > /state/inglou; echo "$$(date -u +%FT%TZ) novo commit $$velho -> $$sha"; atualizar
          fi
          sleep 20
        done
volumes:
  estado:
  segredo:
    external: true
    name: auto-deploy_estado
