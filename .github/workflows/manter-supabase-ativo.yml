name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o login
        run: |
          url=$(curl -fsS -X POST https://inglou.arcanestudios.io/api/v1/auth/google \
            -H 'X-Inglou: 1' -H 'Content-Type: application/json' -d '{}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['url'])")
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          echo "Supabase respondeu $code"
          [ "$code" = 302 ] || exit 1
